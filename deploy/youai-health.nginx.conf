# Include inside the existing api.onesvips.top HTTPS server block.
location = /youai/health {
    proxy_pass http://127.0.0.1:18765/health;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

# The upstream now authenticates every non-health API and checks resource ownership.
location ^~ /youai/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18765/;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    access_log off;
    add_header Cache-Control "no-store" always;
}
