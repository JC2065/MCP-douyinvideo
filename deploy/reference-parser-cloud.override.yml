services:
  postgres:
    mem_limit: 768m
  redis:
    mem_limit: 512m
  browser-rpc:
    image: dtk-browser-rpc:5.1.3
    mem_limit: 2200m
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 768
    tmpfs:
      - /tmp:size=1400m,mode=1777
      - /profiles:size=512m,mode=0700,uid=10001,gid=10001
    shm_size: 512mb
