# Certificate files are provisioned outside Git with restricted permissions.
server {
    listen 80;
    server_name youai888.top www.youai888.top;
    return 301 https://youai888.top$request_uri;
}

server {
    listen 443 ssl;
    server_name youai888.top www.youai888.top;
    ssl_certificate /opt/youai/tls-youai888/fullchain.pem;
    ssl_certificate_key /opt/youai/tls-youai888/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/youai/web-current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /admin { return 302 /youai/admin/; }
    location = /admin/ { return 302 /youai/admin/; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location ~ ^/(index\.html|app\.js|model\.js|style\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/assets/(icons/[a-z0-9-]+\.svg|[a-zA-Z0-9_-]+\.jpg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Larger bodies only where the service accepts them (it re-checks each limit):
    # original video upload 200MB, BYOK replica job 9MB, data-screenshot read 6MB, fragment screenshot/voice 6MB, chat voice input 3MB.
    location = /youai/references/upload {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8765/references/upload;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location = /youai/replica/jobs {
        client_max_body_size 10m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8765/replica/jobs;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location = /youai/ideas/media {
        client_max_body_size 8m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8765/ideas/media;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location = /youai/voice/transcribe {
        client_max_body_size 4m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8765/voice/transcribe;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /youai/board/works {
        client_max_body_size 7m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8765/board/works;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    # Preserve the authenticated video API contract used by the existing gateway.
    location ^~ /youai/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8765/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    location / { return 404; }
}
