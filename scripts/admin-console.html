<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOUAI 管理中台</title>
<style>:root{color:#20314a;background:#f5f8fc;font:16px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:24px}header{border-top:5px solid #0868df;padding:24px 0}h1{font-size:30px;margin:0}h2{font-size:21px;margin:24px 0 12px}.muted{color:#65748a;font-size:14px}button,input{font:inherit}button{cursor:pointer;border:0;background:#0868df;color:white;padding:11px 18px;border-radius:6px;margin:6px 0}button:disabled{background:#d6e0ec;color:#67788a;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #e5ad36;outline-offset:3px}.quiet{background:transparent;color:#0868df}input{display:block;width:100%;border:1px solid #c4d1e2;padding:12px;margin:16px 0;border-radius:6px}#login{max-width:460px;background:white;padding:24px}nav{display:flex;flex-wrap:wrap;overflow-x:auto;border-bottom:1px solid #c8d4e2;gap:10px;margin:18px 0}nav button{white-space:nowrap;background:transparent;color:#65748a;border-radius:0}nav button.active{border-bottom:3px solid #0868df;color:#0868df}#error{color:#9d3030;background:#fff0ef;padding:14px;white-space:pre-wrap}#error:empty{display:none}.line{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #dde5ef;padding:16px 0}.line input{width:24px;height:24px;margin:0}.record{background:white;padding:18px;margin:12px 0;border-left:3px solid #c7d8ed;overflow-wrap:anywhere}.record p{margin:8px 0}.toolbar{display:flex;justify-content:space-between}.revision{font-size:12px;overflow-wrap:anywhere}.detail{border-top:4px solid #0868df;padding-top:16px}.rowbutton{background:white;color:#20314a;display:block;text-align:left;width:100%}[hidden]{display:none!important}@media(max-width:480px){main{padding:18px}h1{font-size:26px}nav{gap:0}nav button{padding:10px 15px}}select,textarea{display:block;width:100%;font:inherit;border:1px solid #c4d1e2;border-radius:6px;padding:10px;margin:10px 0 16px}textarea{min-height:90px;resize:vertical}label{display:block}.ai-status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.ai-status-grid .record{margin:0;font-size:14px;padding:15px}.ai-failure{color:#a0342b}.flow-steps{padding-left:22px}.flow-steps .toolbar{justify-content:flex-start;gap:8px}.flow-steps li{margin:10px 0}.secret-input{margin:10px 0}@media(max-width:700px){.ai-status-grid{grid-template-columns:1fr}}</style>
<main><header><h1>YOUAI 管理中台</h1><div class="muted">服务与内容统一管理</div></header><div id="error" role="alert"></div><form id="login"><h2>管理员登录</h2><p class="muted">使用独立管理账号，微信登录不能授予管理权限。</p><label>账号<input id="username" value="admin" autocomplete="username" maxlength="64"></label><label>管理密码<input id="password" type="password" autocomplete="current-password" maxlength="256" required></label><button>登录中台</button></form><section id="workspace" hidden><div class="toolbar"><button id="refresh" class="quiet">刷新</button><button id="logout" class="quiet">退出登录</button></div><nav id="nav"></nav><div id="content"></div></section></main>
<script>
let token='',config=null,section='总览',busy=false;const names={download:'视频下载',transcript:'文案提取',audio:'音频提取',eraser:'去水印',cover:'封面提取'};const $=id=>document.getElementById(id);const apiBase=location.pathname.replace(/\/admin\/?$/,'')+'/admin-api/';
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function button(label,action,cls='quiet'){const el=node('button',label,cls);el.type='button';el.onclick=()=>run(action);return el;}
async function api(path,data){const res=await fetch(apiBase+path,{method:data?'POST':'GET',credentials:'omit',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(data?{body:JSON.stringify(data)}:{})});const value=await res.json();if(res.status===401){token='';$('workspace').hidden=true;$('login').hidden=false;$('content').replaceChildren();}if(!res.ok)throw Error(value.error||'管理请求失败');return value;}
async function run(action){if(busy)return;busy=true;$('error').textContent='';document.querySelectorAll('button').forEach(el=>el.disabled=true);try{await action();}catch(e){$('error').textContent=e.message;}finally{busy=false;document.querySelectorAll('button').forEach(el=>el.disabled=false);}}
function record(title,subtitle){const el=node('div',undefined,'record');el.append(node('div',title));if(subtitle)el.append(node('p',subtitle,'muted'));return el;}
function time(at){return at?new Date(at*1000).toLocaleString():'尚未更新';}
async function load(){const overview=await api('overview');config=overview.config;const host=$('content');host.replaceChildren();$('nav').replaceChildren();['总览','热点推荐','创作工具','数据积累','确认需求','作品拆解','创作板块','作品产出','模型与密钥','版本','审计'].forEach(label=>$('nav').append(button(label,async()=>{section=label;await load();},section===label?'active':'')));host.append(node('h2',section));
if(section==='创作板块'){await renderCreation(host);}
if(section==='总览'){const platform=await api('platform');renderUsage(host,platform.usage);host.append(node('h3','服务配置状态'),node('p','只显示是否已配置，不显示凭据或私有路径。','muted'));platform.services.forEach(row=>{const el=node('div',undefined,'line');el.append(node('span',row.name),node('span',(row.ok?'✓ ':'✗ ')+row.detail,row.ok?'':'ai-failure'));host.append(el);});host.append(node('h3','任务开放期待'),node('p','期待开放 +1：'+(overview.taskInterest?.total||0)+' 人（按账号去重）'));host.append(node('h3','热点来源'));Object.values(overview.sources).forEach(row=>{const el=node('div',undefined,'line');el.append(node('span',row.platform),node('span',(row.status==='fresh'?'已更新':row.status==='stale'?'更新延迟':'不可用')+' / '+time(row.fetchedAt)));host.append(el);});host.append(node('h3','最近任务'),node('p',overview.taskScope,'muted'));overview.tasks.forEach(row=>host.append(record(row.kind+' · '+row.status,row.id+(row.error?' / '+row.error:''))));if(!overview.tasks.length)host.append(node('p','当前进程没有任务记录。','muted'));}
if(section==='创作工具'||section==='工具'){host.append(node('p','勾选暂停工具，取消恢复。服务端立即生效，客户端提示在下次刷新配置时更新。','muted'));const draft=JSON.parse(JSON.stringify(config.tools));const diff=node('div');Object.keys(names).forEach(key=>{const label=node('label',undefined,'line'),check=document.createElement('input');check.type='checkbox';check.checked=draft[key].maintenance;check.onchange=()=>{draft[key].maintenance=check.checked;diff.replaceChildren();Object.keys(names).filter(k=>draft[k].maintenance!==config.tools[k].maintenance).forEach(k=>diff.append(node('p',names[k]+'：'+(draft[k].maintenance?'暂停':'恢复'))));};label.append(node('span',names[key]),check);host.append(label);});host.append(diff,button('确认并发布',async()=>{if(!Object.keys(names).some(k=>draft[k].maintenance!==config.tools[k].maintenance))return;if(!confirm('确认发布以上工具状态？'))return;await api('config',{expectedRevision:config.revision,tools:draft});await load();},''),node('p','版本 '+config.revision,'muted revision'));await renderVideo(host);}
if(section==='数据积累'){const platform=await api('platform');host.append(node('p','业务数据先写数据库，再由归档任务同步飞书；飞书不可用不影响作品取得。字段映射与失败补偿将在后续批次接入。','muted'));platform.services.filter(r=>/飞书|数据库|素材/.test(r.name)).forEach(row=>{const el=node('div',undefined,'line');el.append(node('span',row.name),node('span',(row.ok?'✓ ':'✗ ')+row.detail,row.ok?'':'ai-failure'));host.append(el);});}
if(section==='确认需求')await renderFlow(host,'requirements');
if(section==='作品拆解'){await renderFlow(host,'analysis');host.append(node('h3','画面、声音与内容理解'));await renderWatch(host);await renderInspirationAi(host,['video_watch','video_watch_deep','video_chat']);}
if(section==='作品产出'){await renderFlow(host,'production');host.append(node('h3','文字作品模型'));await renderInspirationAi(host,['text_works']);}
if(section==='模型与密钥')await renderModels(host);
if(section==='热点推荐'||section==='热点'){await renderInspirationAi(host,['ta_opening','ta_chat','hotspot_summary','idea_note']);await renderPersonalization(host);host.append(node('p','检索提供的是来源摘录；重新获取保留缓存与并发限制。','muted'));const value=await api('hotspots');if(!value.rows.length)host.append(node('p','暂无可用榜单，请稍后刷新。'));value.rows.forEach(row=>host.append(button(row.title+' / '+row.platform+' 第'+row.rank+'位',()=>topic(row.id), 'record rowbutton')));}
if(section==='版本'){const value=await api('versions');if(!value.rows.length)host.append(node('p','发布配置后将保留版本。'));value.rows.forEach(row=>{const el=record(time(row.publishedAt),row.revision);el.append(button('恢复此版本',async()=>{if(!confirm('将恢复工具状态并创建新版本。继续？'))return;await api('config',{expectedRevision:config.revision,rollback:row.revision});await load();}));host.append(el);});}
if(section==='审计'){const value=await api('audit');value.rows.forEach(row=>host.append(record(row.event+' / '+row.actor,time(row.at))));}}

function renderUsage(host,usage){if(!usage)return;host.append(node('h3','AI用量（费用为估算，人民币）'));for(const key of ['today','sevenDays']){const r=usage[key];if(r)host.append(record(key==='today'?'今日':'近7日',r.calls+'次调用 / '+r.cacheHits+'次缓存 / '+r.tokens+' Token / 估算¥'+Number(r.estimatedYuan).toFixed(5)));}}
let creationScope='all';
async function renderTrialAccounts(host){const value=await api('trial-accounts');host.append(node('h3','体验版测试账号'),node('p','体验版/开发版用户可生成测试账号（虚构100号段手机号），数据照常上传并标注为“体验版”。正式上线前请关闭：关闭后测试账号会话立即失效，已有数据保留。','muted'));
const state=node('div',undefined,'line');state.append(node('span','当前：'+(value.enabled?'允许生成':'已关闭')+' · 共 '+value.rows.length+' 个'),button(value.enabled?'关闭测试账号':'重新开启',async()=>{if(!confirm(value.enabled?'关闭后测试账号立即退出登录，确定？':'重新允许体验版生成测试账号？'))return;await api('trial-accounts',{enabled:!value.enabled});await load();}));host.append(state);
value.rows.slice(0,50).forEach(r=>{const el=node('div',undefined,'line');el.append(node('span','体验版 · '+r.nickname+' · '+r.phone),node('span',time(r.created)+' · 创建者 '+r.owner.slice(0,8)));host.append(el);});}
async function renderCreation(host){
const scopeNames={all:'全部账号',formal:'仅正式账号',trial:'仅体验版账号'},scopePick=document.createElement('select');Object.entries(scopeNames).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;scopePick.append(o);});scopePick.value=creationScope;scopePick.onchange=()=>{creationScope=scopePick.value;run(load);};host.append(node('label','统计范围'),scopePick);
const dash=await api('creation/dashboard/'+creationScope);host.append(node('p','全部会话 '+dash.allSessions+'，其中体验版 '+dash.trialSessions+'（当前范围：'+scopeNames[creationScope]+'）','muted'));host.append(node('h3','漏斗与质量'),node('p','会话 '+dash.funnel.sessions+' → 确认 '+dash.funnel.confirmed+' → 拆解 '+dash.funnel.breakdown+' → 产出 '+dash.funnel.output+' → 发布包 '+dash.funnel.works+' → 回传 '+dash.funnel.reported,'muted'));
host.append(node('p','重复提交：第2次 '+Math.round(dash.repeat.second*100)+'% ｜ 第3次及以上 '+Math.round(dash.repeat.thirdPlus*100)+'% ｜ 倒计时自动开拆 '+dash.autoStart.count+' 次，其中后来又纠正/重看 '+dash.autoStart.laterCorrected+' 次','muted'));
host.append(node('p','产出路线：文字作品 '+dash.routes.text+' ｜ 创作包 '+dash.routes.package+' ｜ 套版成片 '+dash.routes.compose,'muted'));
host.append(node('h4','各类型纠错率'));dash.correctionRateByType.forEach(r=>{const el=node('div',undefined,'line');el.append(node('span',r.type),node('span',r.corrected+'/'+r.sessions+'（'+Math.round(r.rate*100)+'%）'));host.append(el);});
const stats=await api('creation/stats/'+creationScope);host.append(node('h3','全站表现（作品播放 ÷ 作者平时中位数）'));if(!stats.rows.length)host.append(node('p','暂无回传数据','muted'));stats.rows.slice(0,30).forEach(r=>{const el=node('div',undefined,'line');el.append(node('span',r.group),node('span',r.works+' 条 · 中位 '+r.medianRatio+' 倍'));host.append(el);});
const clusters=await api('creation/clusters');host.append(node('h3','用户新建的拆解类型（按名称聚类）'));clusters.rows.slice(0,40).forEach(c=>{const box=node('div',undefined,'card');box.append(node('strong',c.name+'（'+c.plans.length+'）'));c.plans.slice(0,5).forEach(p=>{const el=node('div',undefined,'line');el.append(node('span',p.name+' · '+p.source+' · '+p.fields+' 个字段'),button('升级为内置',async()=>{if(!confirm('把「'+p.name+'」复制为所有用户可见的内置方案？'))return;await api('creation/promote',{planId:p.id});await load();}));box.append(el);});host.append(box);});
host.append(node('h3','会话上报'));const kinds=['new_type','confirm','interview','breakdown','output_text','output_package','metrics','rewatch','induce','all'];const list=node('div');const pick=document.createElement('select');kinds.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;pick.append(o);});
async function show(){list.replaceChildren();const rows=(await api('creation/reports/'+pick.value+'/'+creationScope)).rows;if(!rows.length)list.append(node('p','暂无','muted'));rows.forEach(r=>{const d=document.createElement('details');d.append(node('summary',new Date(r.at*1000).toLocaleString()+' · '+r.kind+' · '+(r.account==='体验版'?'【体验版】':'')+r.user.slice(0,8)));const pre=node('pre',JSON.stringify(r.payload,null,1).slice(0,6000));d.append(pre);list.append(d);});}
pick.onchange=show;host.append(pick,list);await show();
const platform=await api('platform'),draft=JSON.parse(JSON.stringify(platform.creationBoard));host.append(node('h3','创作板块参数'));
const labels={countdownSeconds:'确认卡倒计时（秒）',autoConfidence:'倒计时所需理解把握',rewatchLimit:'每条视频重看次数',interviewTurns:'对话式问答轮数',attemptWindowDays:'重复提交统计窗口（天）',similarityThreshold:'改写相似度提示阈值',maxPlanFields:'方案自定义字段上限',reviewVotes:'触发共享复核的纠正人数',rewardPerMetrics:'每次回传奖励次数',streakUnlock:'解锁专属复盘所需回传条数',predictMinWorks:'解锁发布前预估所需回传条数',composeMaxSeconds:'套版成片最长秒数'};
for(const key of Object.keys(labels))host.append(field(labels[key],draft[key],'number',v=>draft[key]=Number(v),{step:['autoConfidence','similarityThreshold'].includes(key)?0.05:1}));
host.append(field('订阅消息模板ID（小程序后台申请后填写）',draft.subscribeTemplateId,'text',v=>draft.subscribeTemplateId=v.trim()));
host.append(button('发布创作板块参数',async()=>{if(!confirm('发布创作板块参数？'))return;await api('platform',{expectedRevision:platform.revision,connections:platform.custom,video:platform.video,image:platform.image,personalization:platform.personalization,videoUnderstanding:platform.videoUnderstanding,creationBoard:draft});await load();}));
await renderTrialAccounts(host);
await renderInspirationAi(host,['board_breakdown','board_plan','board_interview','board_output','data_screenshot','video_glance']);}
async function renderWatch(host){const platform=await api('platform'),draft=JSON.parse(JSON.stringify(platform.videoUnderstanding));renderUsage(host,platform.usage);host.append(node('h3','低成本视频观看'));
const ranges={maxAnalyzeSeconds:[30,300],maxFrames:[8,48],frameShortSide:[240,768],deepWatchThreshold:[0,1],chatMaxTurns:[1,4],perUserDailyVideos:[0,10000],dailyBudgetYuan:[0,100000]};
const labels={maxAnalyzeSeconds:'最长分析秒数',maxFrames:'代表帧上限',frameShortSide:'画面短边',deepWatchThreshold:'深度升级置信阈值',chatMaxTurns:'对话调用上限（含开场）',perUserDailyVideos:'每用户每日新视频数',dailyBudgetYuan:'全站每日预算（元）'};
for(const [key,range] of Object.entries(ranges))host.append(field(labels[key],draft[key],'number',v=>draft[key]=Number(v),{min:range[0],max:range[1],step:key==='deepWatchThreshold'?0.1:1}));
host.append(field('提示词版本',draft.promptVersion,'text',v=>draft.promptVersion=v));
const asrLabel=node('label','视频转写模型（语音输入固定 tiny）'),asr=document.createElement('select');for(const name of ['tiny','base','small']){const option=node('option',name);option.value=name;asr.append(option);}asr.value=draft.asrModel||'small';asr.onchange=()=>draft.asrModel=asr.value;asrLabel.append(asr);host.append(asrLabel);
const prices=node('label','模型单价JSON（元/百万Token，in/out）'),pricesInput=document.createElement('textarea'),pricesError=node('p','','ai-failure');pricesInput.value=JSON.stringify(draft.prices,null,2);pricesInput.rows=8;pricesInput.spellcheck=false;pricesInput.setAttribute('aria-label','模型单价JSON（元/百万Token，in/out）');prices.append(pricesInput);host.append(prices,pricesError);
const label=node('label','低置信时自动深度观看（默认关闭）'),check=document.createElement('input');check.type='checkbox';check.checked=draft.autoDeepWatch;check.onchange=()=>draft.autoDeepWatch=check.checked;label.append(check);host.append(label,button('发布观看配置',async()=>{if(!confirm('发布观看参数与预算？'))return;try{draft.prices=JSON.parse(pricesInput.value);pricesError.textContent='';}catch(_){pricesError.textContent='单价 JSON 格式无效，请修正后再发布。';return;}await api('platform',{expectedRevision:platform.revision,connections:platform.custom,video:platform.video,image:platform.image,personalization:platform.personalization,videoUnderstanding:draft});await load();}));}
async function renderInspirationAi(host,only){
 const value=await api('inspiration-ai'),draft=JSON.parse(JSON.stringify(value.scenes));const shown=value.rows.filter(r=>!only||only.includes(r.id));
 host.append(node('h3',only&&only.length===1?'AI 场景配置':'灵感 AI 统一配置'),node('p','修改后发布生效。密钥在“模型与密钥”中只写不读，这里只选择已注册的连接。','muted'));
 value.connections.forEach(c=>host.append(record(c.name+' / '+(c.credentialConfigured?'凭据已配置':'凭据未配置'),c.endpoint)));
 host.append(node('p',value.notice,'muted'));const endpoints={ta_opening:'/topics/chat · opening=true',ta_chat:'/topics/chat · opening=false',hotspot_summary:'/hotspots/summary',text_works:'/works/text',reference_understanding:'/references/analyze · 多模态识别'};
 function status(row){return row?(row.ok?'成功':'失败')+' · '+row.message+' · '+time(row.at)+' · '+row.latencyMs+'ms'+(row.httpStatus?' · HTTP '+row.httpStatus:''):'尚无记录';}
 const statusGrid=node('div',undefined,'ai-status-grid');shown.forEach(row=>{const state=record(row.name+' · '+(row.config.enabled?'已启用':'已暂停'));state.append(node('p','业务：'+status(row.lastBusiness),row.lastBusiness&&!row.lastBusiness.ok?'ai-failure':'muted'),node('p','检测：'+status(row.lastProbe),row.lastProbe&&!row.lastProbe.ok?'ai-failure':'muted'));statusGrid.append(state);});host.append(statusGrid);
 shown.forEach(row=>{const card=record(row.name,endpoints[row.id]);card.dataset.scene=row.id;const cfg=draft[row.id];
 const enabled=node('label',undefined,'line'),check=document.createElement('input');check.type='checkbox';check.checked=cfg.enabled;check.dataset.field='enabled';check.onchange=()=>cfg.enabled=check.checked;enabled.append(node('span','启用此功能'),check);card.append(enabled);
 const connection=node('label','模型连接'),select=document.createElement('select');value.connections.forEach(c=>{const o=node('option',c.name);o.value=c.id;select.append(o);});select.value=cfg.connection;select.onchange=()=>cfg.connection=select.value;connection.append(select);card.append(connection);
 for(const [key,label,type] of [['model','模型 ID','text'],['timeoutSeconds','超时（观看5–120秒，其他5–40秒）','number'],['maxTokens','输出上限（32–4096 Token）','number']]){const l=node('label',label),i=document.createElement('input');i.type=type;i.value=cfg[key];i.dataset.field=key;i.oninput=()=>cfg[key]=type==='number'?Number(i.value):i.value.trim();if(type==='text')i.maxLength=80;l.append(i);card.append(l);}
 const l=node('label','补充风格提示词'),area=document.createElement('textarea');area.value=cfg.instruction;area.maxLength=1000;area.dataset.field='instruction';area.oninput=()=>cfg.instruction=area.value;l.append(area);card.append(l);
 card.append(node('p','最近业务调用：'+status(row.lastBusiness),'muted'),node('p','最近连接检测：'+status(row.lastProbe),'muted'),node('p','最近保留请求中：'+row.calls+'次业务调用 / '+row.failures+'次失败','muted'));
 card.append(button('检测连接（少量Token）',async()=>{if(!confirm('将对该场景进行一次少量Token的真实模型调用，可能产生费用。继续？'))return;let failure;try{await api('inspiration-ai/probe',{scene:row.id});}catch(e){failure=e;}await load();if(failure)throw failure;},'quiet ai-probe'));host.append(card);
 });

function field(label,value,type,onInput,extra){const l=node('label',label),i=document.createElement('input');i.type=type||'text';i.value=value??'';if(extra)Object.assign(i,extra);i.oninput=()=>onInput(i.type==='number'?Number(i.value):i.value.trim());l.append(i);return l;}
async function publishPlatform(platform,connections,video,message,image,personalization){if(!confirm(message))return;await api('platform',{expectedRevision:platform.revision,connections,video,image:image||platform.image,personalization:personalization||platform.personalization});await load();}

 for(const [key,label] of [['up','“喜欢”权重'],['down','“不想要”权重'],['adopt','采纳选题权重'],['work','保存作品权重']])card.append(field(label+'（0–10）',p.weights[key],'number',v=>p.weights[key]=v));
 card.append(button('确认并发布个性化规则',()=>{if(JSON.stringify(p)===JSON.stringify(platform.personalization))throw Error('没有配置变更');return publishPlatform(platform,platform.custom,platform.video,'发布个性化规则？只影响之后的对话。',platform.image,p);},''));host.append(card);

async function renderModels(host){
 const platform=await api('platform'),custom=JSON.parse(JSON.stringify(platform.custom));
 host.append(node('p',platform.notice,'muted'));
 platform.connections.forEach(c=>{const card=record(c.name+(c.builtin?'':' · 自定义'),c.endpoint+(c.defaultModel?' · 默认模型 '+c.defaultModel:''));card.dataset.connection=c.id;
  card.append(node('p',c.credential.configured?'密钥已配置 · 来源：'+c.credential.source+' · 末4位 '+c.credential.last4+(c.credential.updatedAt?' · '+time(c.credential.updatedAt):''):'密钥未配置',c.credential.configured?'muted':'ai-failure'));
  if(platform.scenesUsing.includes(c.id))card.append(node('p','正被 AI 场景使用','muted'));
  const key=document.createElement('input');key.type='password';key.autocomplete='off';key.placeholder='输入新密钥（只写不读）';key.maxLength=512;key.className='secret-input';card.append(key);
  card.append(button('保存新密钥',async()=>{if(!key.value)throw Error('请输入密钥');if(!confirm('用新密钥替换「'+c.name+'」当前密钥？保存后不会再显示。'))return;const value=key.value;key.value='';await api('platform/secret',{ref:c.id,value});await load();}));

  if(c.kind==='chat')card.append(button('检测连接（少量Token）',async()=>{if(!confirm('将对该连接进行一次少量Token的真实调用，可能产生费用。继续？'))return;const r=await api('platform/probe',{connection:c.id});alert((r.ok?'成功':'失败')+'：'+r.message);}));
  host.append(card);});
 host.append(node('h3','自定义文本模型连接'),node('p','兼容 OpenAI Chat Completions 的公网 HTTPS 接口（如 DeepSeek、豆包、Kimi、智谱）。发布后到对应 AI 场景选择该连接。最多8个。','muted'));
 const list=node('div');host.append(list);
 function draw(){list.replaceChildren();custom.forEach((row,index)=>{const card=record('连接 '+(index+1));card.append(field('连接 ID（小写字母/数字/短横线）',row.id,'text',v=>row.id=v,{maxLength:31}),field('名称',row.name,'text',v=>row.name=v,{maxLength:30}),field('接口地址（完整 chat/completions 地址）',row.endpoint,'url',v=>row.endpoint=v,{maxLength:300}),field('默认模型 ID',row.defaultModel,'text',v=>row.defaultModel=v,{maxLength:80}),button('移除此连接',()=>{custom.splice(index,1);draw();}));list.append(card);});}
 draw();

 if(platform.versions.length){const history=node('details');history.append(node('summary','平台配置历史与回滚'));platform.versions.forEach(v=>{const r=record(time(v.publishedAt),v.revision+' · '+v.connections+'个自定义连接 · '+(v.videoModel||''));r.append(button('恢复此版本',async()=>{if(!confirm('恢复连接与视频配置（不含密钥），并新建一个版本。继续？'))return;await api('platform',{expectedRevision:platform.revision,rollback:v.revision});await load();}));history.append(r);});host.append(history);}

async function renderFlow(host,stage){
 const data=await api('workflows'),flow=data.workflows.find(w=>w.stage===stage);const steps=JSON.parse(JSON.stringify((flow.draft||flow.published).steps));
 host.append(node('p',data.notice,'muted'),node('p','当前发布：'+flow.published.version+(flow.published.publishedAt?' · '+time(flow.published.publishedAt):' · 系统默认'),'muted'));
 if(flow.draft){const d=record('未发布草案 · '+time(flow.draft.updatedAt));(flow.diff.length?flow.diff:['与发布版本相同']).forEach(t=>d.append(node('p',t)));flow.errors.forEach(e=>d.append(node('p','✗ '+e,'ai-failure')));host.append(d);}
 const list=node('ol',undefined,'flow-steps');host.append(list);
 function draw(){list.replaceChildren();steps.forEach((row,index)=>{const li=node('li',undefined,'record');li.dataset.step=row.id;li.append(node('div',data.capabilities[row.capability]+(row.required?' · 必需':' · 可选'),'muted'));
  li.append(field('步骤名称',row.title,'text',v=>row.title=v,{maxLength:80}));
  const bar=node('div',undefined,'toolbar');bar.append(button('上移',()=>{if(index>0){[steps[index-1],steps[index]]=[steps[index],steps[index-1]];draw();}}),button('下移',()=>{if(index<steps.length-1){[steps[index+1],steps[index]]=[steps[index],steps[index+1]];draw();}}));if(!row.required)bar.append(button('移除',()=>{steps.splice(index,1);draw();}));li.append(bar);list.append(li);});
  const missing=flow.defaults.filter(s=>!steps.some(r=>r.id===s.id));missing.forEach(s=>list.append(button('恢复可选步骤：'+s.title,()=>{steps.push(JSON.parse(JSON.stringify(s)));draw();})));}
 draw();
 host.append(button('保存草案',async()=>{await api('workflows/'+stage+'/draft',{expectedRevision:flow.revision,steps});await load();},''));
 if(flow.draft){host.append(button('发布草案',async()=>{if(flow.errors.length)throw Error('草案未通过校验：'+flow.errors[0]);if(!confirm('发布以下变更？\n'+(flow.diff.join('\n')||'与发布版本相同')+'\n\n已在运行的任务保留原快照。'))return;await api('workflows/'+stage+'/publish',{expectedRevision:flow.revision});await load();}),button('放弃草案',async()=>{if(!confirm('放弃未发布的草案？'))return;await api('workflows/'+stage+'/draft',{expectedRevision:flow.revision,discard:true});await load();}));}
 const history=node('details');history.append(node('summary','流程版本与回滚'));[{version:'default-v1',publishedAt:null,steps:flow.defaults.length}].concat(flow.versions).forEach(v=>{const r=record(v.version+' · '+v.steps+'个步骤',v.publishedAt?time(v.publishedAt):'系统默认');if(v.version!==flow.published.version)r.append(button('恢复此版本',async()=>{if(!confirm('恢复为'+v.version+'并新建发布版本？'))return;await api('workflows/'+stage+'/rollback',{expectedRevision:flow.revision,version:v.version});await load();}));history.append(r);});host.append(history);
}
async function topic(id,retry=false){const value=await api('topics/'+id,retry?{}:undefined);document.querySelector('.detail')?.remove();const el=node('section',undefined,'detail');el.append(node('h2',value.title||'话题内容'),node('p','内容状态：'+value.status),node('p',value.notice,'muted'));(value.items||[]).forEach(item=>el.append(record(item.title,(item.source||'')+' / '+(item.publishedAt||'')+' — '+item.excerpt)));el.append(button('刷新状态',()=>topic(id)),button('重新获取内容',()=>topic(id,true)),button('关闭详情',()=>el.remove()));$('content').append(el);el.scrollIntoView({behavior:'smooth',block:'start'});}
