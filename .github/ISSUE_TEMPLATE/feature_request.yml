name: 功能建议 / Feature request
description: 提一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你在创作中遇到的具体场景
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
