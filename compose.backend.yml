services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: youai
      POSTGRES_USER: youai
      POSTGRES_PASSWORD: local-only-password
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["youai-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U youai -d youai"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://youai:local-only-password@postgres:5432/youai
      DATABASE_SSL_MODE: disable
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  youai-postgres:
